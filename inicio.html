<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#51386a">
  <title>Elige asignatura y curso</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fontsource-opendyslexic/5.3.0/index.css">
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-synthesis: none;

      --color-texto: #292431;
      --color-fondo-1: #e9dcff;
      --color-fondo-2: #fbf9ff;
      --color-fondo-3: #f5f1f9;
      --color-tarjeta-bg: #fff;
      --color-tarjeta-borde: #e2d9eb;
      --color-tarjeta-sombra: #39264e12;
      --color-etiqueta-borde: #d7c8e7;
      --color-acento: #604777;
      --color-acento-hover: #4c3562;
      --color-titulo: #39264e;
      --color-texto-suave: #625b6c;
      --color-label: #51495d;
      --color-input-borde: #cfc4da;
      --color-input-bg: #fff;
      --color-input-texto: #302a38;
      --color-focus: #aa8ac8;
      --color-boton-secundario-bg: #eee8f4;
      --color-boton-secundario-texto: #40334e;
      --color-boton-secundario-hover: #e2d8ec;
      --color-error: #a32939;
      --color-estado: #46315c;
      --color-icono-hover: #f1eafa;
      --tam-texto: 1;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --color-texto: #e7e1ef;
      --color-fondo-1: #3a2b52;
      --color-fondo-2: #1c1724;
      --color-fondo-3: #221b2c;
      --color-tarjeta-bg: #2a2234;
      --color-tarjeta-borde: #40334e;
      --color-tarjeta-sombra: #00000040;
      --color-etiqueta-borde: #4d3c5c;
      --color-acento: #9a7ec4;
      --color-acento-hover: #b399db;
      --color-titulo: #e9dcff;
      --color-texto-suave: #c3b8cf;
      --color-label: #cfc4da;
      --color-input-borde: #4d3c5c;
      --color-input-bg: #221b2c;
      --color-input-texto: #e7e1ef;
      --color-focus: #b399db;
      --color-boton-secundario-bg: #3a2f47;
      --color-boton-secundario-texto: #e7e1ef;
      --color-boton-secundario-hover: #473a57;
      --color-error: #f28b9d;
      --color-estado: #d9cce7;
      --color-icono-hover: #3a2f47;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]):not([data-theme="dark"]) {
        color-scheme: dark;
        --color-texto: #e7e1ef;
        --color-fondo-1: #3a2b52;
        --color-fondo-2: #1c1724;
        --color-fondo-3: #221b2c;
        --color-tarjeta-bg: #2a2234;
        --color-tarjeta-borde: #40334e;
        --color-tarjeta-sombra: #00000040;
        --color-etiqueta-borde: #4d3c5c;
        --color-acento: #9a7ec4;
        --color-acento-hover: #b399db;
        --color-titulo: #e9dcff;
        --color-texto-suave: #c3b8cf;
        --color-label: #cfc4da;
        --color-input-borde: #4d3c5c;
        --color-input-bg: #221b2c;
        --color-input-texto: #e7e1ef;
        --color-focus: #b399db;
        --color-boton-secundario-bg: #3a2f47;
        --color-boton-secundario-texto: #e7e1ef;
        --color-boton-secundario-hover: #473a57;
        --color-error: #f28b9d;
        --color-estado: #d9cce7;
        --color-icono-hover: #3a2f47;
      }
    }

    :root[data-contraste="alto"] {
      --color-texto: #000 !important;
      --color-titulo: #000 !important;
      --color-label: #000 !important;
      --color-texto-suave: #000 !important;
      --color-tarjeta-borde: #000 !important;
      --color-input-borde: #000 !important;
      --color-etiqueta-borde: #000 !important;
      --color-acento: #2a0750 !important;
      --color-acento-hover: #1a0433 !important;
      --color-tarjeta-bg: #fff !important;
      --color-input-bg: #fff !important;
      --color-input-texto: #000 !important;
      --color-fondo-1: #fff !important;
      --color-fondo-2: #fff !important;
      --color-fondo-3: #fff !important;
      --color-error: #8b0000 !important;
      --color-estado: #000 !important;
      --color-focus: #000 !important;
    }

    :root[data-movimiento="reducido"] *,
    :root[data-movimiento="reducido"] *::before,
    :root[data-movimiento="reducido"] *::after {
      transition: none !important;
      animation: none !important;
    }

    :root[data-fuente="dislexia"] body {
      font-family: "Open Dyslexic", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    [data-contraste="alto"] .tarjeta,
    [data-contraste="alto"] .panel-config,
    [data-contraste="alto"] select,
    [data-contraste="alto"] .campo-sesion input,
    [data-contraste="alto"] .etiqueta,
    [data-contraste="alto"] .logo-usuarios,
    [data-contraste="alto"] .logo-config {
      border-width: 2px;
    }

    * { box-sizing: border-box; }

    html { font-size: calc(16px * var(--tam-texto)); }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-texto);
      background: var(--color-fondo-3);
      background:
        radial-gradient(circle at 8% 6%, var(--color-fondo-1) 0, transparent 24rem),
        linear-gradient(180deg, var(--color-fondo-2), var(--color-fondo-3));
      transition: background .2s ease, color .2s ease;
    }

    .tarjeta {
      width: min(480px, calc(100% - 32px));
      margin: 32px 0;
      padding: 32px;
      border: 1px solid var(--color-tarjeta-borde);
      border-radius: 20px;
      background: var(--color-tarjeta-bg);
      box-shadow: 0 8px 24px var(--color-tarjeta-sombra);
      transition: background .2s ease, border-color .2s ease;
    }

    .etiqueta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border: 1px solid var(--color-etiqueta-borde);
      border-radius: 999px;
      background: var(--color-tarjeta-bg);
      color: var(--color-acento);
      font-size: .85rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    h1 { margin: 16px 0 8px; color: var(--color-titulo); font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.15; }
    p.intro { margin: 0 0 24px; color: var(--color-texto-suave); font-size: 1.02rem; line-height: 1.5; }

    .selector { display: grid; gap: 5px; margin-bottom: 18px; }
    label { color: var(--color-label); font-size: .9rem; font-weight: 750; }

    select { font: inherit; }

    select {
      min-height: 46px;
      padding: 9px 38px 9px 12px;
      border: 1px solid var(--color-input-borde);
      border-radius: 11px;
      background: var(--color-input-bg);
      color: var(--color-input-texto);
    }

    select:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }

    .boton-comenzar {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-top: 6px;
      padding: 10px 16px;
      border: 0;
      border-radius: 11px;
      background: var(--color-acento);
      color: white;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform .14s ease, background .14s ease;
    }

    .boton-comenzar:hover { transform: translateY(-1px); background: var(--color-acento-hover); }
    .boton-comenzar:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }

    .sesion { margin-top: 20px; padding-top: 18px; border-top: 1px dashed var(--color-tarjeta-borde); }
    .sesion summary { color: var(--color-acento); font-weight: 750; font-size: .92rem; cursor: pointer; }
    .campo-sesion { display: grid; gap: 5px; margin-top: 12px; }
    .campo-sesion input {
      min-height: 42px;
      padding: 8px 12px;
      border: 1px solid var(--color-input-borde);
      border-radius: 10px;
      font: inherit;
      background: var(--color-input-bg);
      color: var(--color-input-texto);
    }
    .campo-clave { position: relative; }
    .campo-clave input { padding-right: 40px; width: 100%; }
    .boton-ver-clave {
      position: absolute;
      top: 50%;
      right: 4px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      min-height: auto;
      padding: 0;
      border: 0;
      background: none;
      font-size: 1.1rem;
      line-height: 1;
      color: var(--color-texto-suave);
      cursor: pointer;
    }
    .boton-ver-clave:hover { color: var(--color-acento); }
    .boton-sesion {
      min-height: 42px;
      margin-top: 10px;
      padding: 8px 14px;
      border: 0;
      border-radius: 10px;
      background: var(--color-acento);
      color: white;
      font-weight: 750;
      font: inherit;
      cursor: pointer;
    }
    .boton-sesion:hover { background: var(--color-acento-hover); }
    .boton-sesion.secundario { background: var(--color-boton-secundario-bg); color: var(--color-boton-secundario-texto); }
    .boton-sesion.secundario:hover { background: var(--color-boton-secundario-hover); }
    .error-sesion { min-height: 1.2em; margin: 8px 0 0; color: var(--color-error); font-size: .85rem; font-weight: 700; }
    .estado-sesion { color: var(--color-estado); font-weight: 750; font-size: .92rem; }

    .logo-usuarios, .logo-config {
      position: fixed;
      top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: 1px solid var(--color-etiqueta-borde);
      border-radius: 50%;
      background: var(--color-tarjeta-bg);
      font-size: 1.4rem;
      text-decoration: none;
      box-shadow: 0 8px 24px var(--color-tarjeta-sombra);
      transition: transform .14s ease, background .14s ease;
      cursor: pointer;
    }

    .logo-usuarios { right: 20px; }
    .logo-config { left: 20px; border: none; }

    .logo-usuarios:hover, .logo-config:hover { transform: translateY(-2px); background: var(--color-icono-hover); }
    .logo-usuarios:focus-visible, .logo-config:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 2px; }

    .panel-config {
      position: fixed;
      top: 76px;
      left: 20px;
      z-index: 10;
      width: min(280px, calc(100vw - 40px));
      padding: 20px;
      border: 1px solid var(--color-tarjeta-borde);
      border-radius: 16px;
      background: var(--color-tarjeta-bg);
      box-shadow: 0 8px 24px var(--color-tarjeta-sombra);
    }
    .panel-config[hidden] { display: none; }
    .panel-config h2 { margin: 0 0 14px; font-size: 1rem; color: var(--color-titulo); }
    .panel-config .selector { margin-bottom: 14px; }
    .panel-config .selector:last-child { margin-bottom: 0; }
    .panel-config select {
      width: 100%;
    }
  </style>
</head>
<body>
  <a href="usuarios.html" class="logo-usuarios" title="Gestionar usuarios" aria-label="Gestionar usuarios">👤</a>
  <button type="button" class="logo-config" id="boton-config" title="Configuración" aria-label="Configuración">⚙️</button>

  <div class="panel-config" id="panel-config" hidden>
    <h2>⚙️ Configuración</h2>
    <div class="selector">
      <label for="select-tema">Tema</label>
      <select id="select-tema">
        <option value="auto">Automático</option>
        <option value="light">Claro</option>
        <option value="dark">Oscuro</option>
      </select>
    </div>
    <div class="selector">
      <label for="select-tamano">Tamaño de texto</label>
      <select id="select-tamano">
        <option value="normal">Normal</option>
        <option value="grande">Grande</option>
      </select>
    </div>
    <div class="selector">
      <label for="select-contraste">Contraste</label>
      <select id="select-contraste">
        <option value="normal">Normal</option>
        <option value="alto">Alto contraste</option>
      </select>
    </div>
    <div class="selector">
      <label for="select-fuente">Fuente</label>
      <select id="select-fuente">
        <option value="normal">Normal</option>
        <option value="dislexia">Apta para dislexia</option>
      </select>
    </div>
    <div class="selector">
      <label for="select-movimiento">Animaciones</label>
      <select id="select-movimiento">
        <option value="normal">Activadas</option>
        <option value="reducido">Reducidas</option>
      </select>
    </div>
    <button type="button" id="boton-restablecer" class="boton-sesion secundario" style="width: 100%;">🔄 Restablecer progreso</button>
  </div>

  <div class="tarjeta">
    <span class="etiqueta">🏠 Página de inicio</span>
    <h1>¿Qué quieres practicar hoy?</h1>
    <p class="intro">Elige la asignatura y el curso.</p>

    <div class="selector">
      <label for="asignatura">Asignatura</label>
      <select id="asignatura">
        <option value="matematicas">Matemáticas</option>
        <option value="ingles">Inglés</option>
        <option value="conocimiento-del-medio">Conocimiento del medio</option>
      </select>
    </div>

    <div class="selector">
      <label for="curso">Curso</label>
      <select id="curso">
        <option value="4-primaria">4.º de Primaria</option>
      </select>
    </div>

    <a id="comenzar" class="boton-comenzar" href="index.html">▶️ Comenzar</a>

    <details class="sesion" id="panel-sesion">
      <summary>🔑 Acceso docente (opcional)</summary>
      <div id="vista-invitado">
        <div class="campo-sesion">
          <label for="usuario-login">Usuario</label>
          <input id="usuario-login" type="text" autocomplete="username">
        </div>
        <div class="campo-sesion">
          <label for="clave-login">Contraseña</label>
          <div class="campo-clave">
            <input id="clave-login" type="password" autocomplete="current-password">
            <button type="button" class="boton-ver-clave" data-clave="clave-login" title="Mostrar contraseña" aria-label="Mostrar contraseña">👁️</button>
          </div>
        </div>
        <p id="error-login" class="error-sesion"></p>
        <button id="boton-login" type="button" class="boton-sesion">Iniciar sesión</button>
      </div>

      <div id="vista-sesion" hidden>
        <p class="estado-sesion">Sesión iniciada como <span id="nombre-sesion"></span></p>
        <button id="boton-logout" type="button" class="boton-sesion secundario">Cerrar sesión</button>
      </div>
    </details>
  </div>

  <script>
    const destinos = {
      "matematicas|4-primaria": "index.html",
      "ingles|4-primaria": "https://marconevi-lab.github.io/Educacion-de-ingles/",
      "conocimiento-del-medio|4-primaria": "https://marconevi-lab.github.io/Educacion-de-conocimiento-del-medio/"
    };

    const asignatura = document.querySelector("#asignatura");
    const curso = document.querySelector("#curso");
    const comenzar = document.querySelector("#comenzar");

    function actualizarDestino() {
      const destino = destinos[`${asignatura.value}|${curso.value}`];
      comenzar.href = destino || "#";
    }

    asignatura.addEventListener("change", actualizarDestino);
    curso.addEventListener("change", actualizarDestino);
    actualizarDestino();

    // Gestión de usuarios (guardada en este navegador, sin servidor)
    const CLAVE_USUARIOS = "edu-usuarios";
    const CLAVE_SESION = "edu-sesion";

    function cargarUsuarios() {
      try {
        const guardado = JSON.parse(localStorage.getItem(CLAVE_USUARIOS));
        if (Array.isArray(guardado) && guardado.length) return guardado;
      } catch {
        // Si no hay usuarios guardados o están corruptos, se recrea el admin inicial.
      }
      const iniciales = [{ usuario: "admin", clave: "Imanes.26-27", rol: "admin" }];
      localStorage.setItem(CLAVE_USUARIOS, JSON.stringify(iniciales));
      return iniciales;
    }

    function guardarUsuarios(lista) {
      localStorage.setItem(CLAVE_USUARIOS, JSON.stringify(lista));
    }

    function obtenerSesion() {
      try {
        return JSON.parse(localStorage.getItem(CLAVE_SESION));
      } catch {
        return null;
      }
    }

    const vistaInvitado = document.querySelector("#vista-invitado");
    const vistaSesion = document.querySelector("#vista-sesion");
    const nombreSesion = document.querySelector("#nombre-sesion");
    const errorLogin = document.querySelector("#error-login");

    function pintarSesion() {
      const sesion = obtenerSesion();
      vistaInvitado.hidden = !!sesion;
      vistaSesion.hidden = !sesion;
      if (sesion) nombreSesion.textContent = sesion.usuario;
    }

    document.querySelector("#boton-login").addEventListener("click", () => {
      const usuario = document.querySelector("#usuario-login").value.trim();
      const clave = document.querySelector("#clave-login").value;
      const usuarios = cargarUsuarios();
      const encontrado = usuarios.find((u) => u.usuario === usuario && u.clave === clave);
      if (!encontrado) {
        errorLogin.textContent = "Usuario o contraseña incorrectos.";
        return;
      }
      errorLogin.textContent = "";
      localStorage.setItem(CLAVE_SESION, JSON.stringify({ usuario: encontrado.usuario, rol: encontrado.rol }));
      pintarSesion();
    });

    document.querySelector("#boton-logout").addEventListener("click", () => {
      localStorage.removeItem(CLAVE_SESION);
      pintarSesion();
    });

    document.querySelectorAll(".boton-ver-clave").forEach((boton) => {
      boton.addEventListener("click", () => {
        const campo = document.querySelector(`#${boton.dataset.clave}`);
        const verClave = campo.type === "password";
        campo.type = verClave ? "text" : "password";
        boton.textContent = verClave ? "🙈" : "👁️";
        boton.title = verClave ? "Ocultar contraseña" : "Mostrar contraseña";
        boton.setAttribute("aria-label", boton.title);
      });
    });

    cargarUsuarios();
    pintarSesion();

    // Configuración (tema y tamaño de texto), exclusiva de esta página.
    const CLAVE_CONFIG = "edu-config-inicio";

    function cargarConfig() {
      try {
        const guardado = JSON.parse(localStorage.getItem(CLAVE_CONFIG));
        if (guardado && typeof guardado === "object") return guardado;
      } catch {}
      return { tema: "auto", tamano: "normal", contraste: "normal", fuente: "normal", movimiento: "normal" };
    }

    function guardarConfig(config) {
      localStorage.setItem(CLAVE_CONFIG, JSON.stringify(config));
    }

    function aplicarConfig(config) {
      const raiz = document.documentElement;

      if (config.tema === "light" || config.tema === "dark") {
        raiz.setAttribute("data-theme", config.tema);
      } else {
        raiz.removeAttribute("data-theme");
      }

      raiz.style.setProperty("--tam-texto", config.tamano === "grande" ? "1.15" : "1");

      if (config.contraste === "alto") {
        raiz.setAttribute("data-contraste", "alto");
      } else {
        raiz.removeAttribute("data-contraste");
      }

      if (config.fuente === "dislexia") {
        raiz.setAttribute("data-fuente", "dislexia");
      } else {
        raiz.removeAttribute("data-fuente");
      }

      if (config.movimiento === "reducido") {
        raiz.setAttribute("data-movimiento", "reducido");
      } else {
        raiz.removeAttribute("data-movimiento");
      }
    }

    const selectTema = document.querySelector("#select-tema");
    const selectTamano = document.querySelector("#select-tamano");
    const selectContraste = document.querySelector("#select-contraste");
    const selectFuente = document.querySelector("#select-fuente");
    const selectMovimiento = document.querySelector("#select-movimiento");
    const botonConfig = document.querySelector("#boton-config");
    const panelConfig = document.querySelector("#panel-config");
    const botonRestablecer = document.querySelector("#boton-restablecer");

    let config = cargarConfig();
    selectTema.value = config.tema;
    selectTamano.value = config.tamano;
    selectContraste.value = config.contraste;
    selectFuente.value = config.fuente;
    selectMovimiento.value = config.movimiento;
    aplicarConfig(config);

    botonConfig.addEventListener("click", () => {
      panelConfig.hidden = !panelConfig.hidden;
    });

    document.addEventListener("click", (e) => {
      if (!panelConfig.hidden && !panelConfig.contains(e.target) && e.target !== botonConfig) {
        panelConfig.hidden = true;
      }
    });

    function escucharCambio(select, campo) {
      select.addEventListener("change", () => {
        config[campo] = select.value;
        guardarConfig(config);
        aplicarConfig(config);
      });
    }

    escucharCambio(selectTema, "tema");
    escucharCambio(selectTamano, "tamano");
    escucharCambio(selectContraste, "contraste");
    escucharCambio(selectFuente, "fuente");
    escucharCambio(selectMovimiento, "movimiento");

    botonRestablecer.addEventListener("click", () => {
      const confirmado = confirm("Esto borrará el progreso guardado en este navegador (ejercicios completados). No afecta a tu cuenta ni contraseña. ¿Continuar?");
      if (!confirmado) return;
      Object.keys(localStorage)
        .filter((clave) => /progreso/i.test(clave))
        .forEach((clave) => localStorage.removeItem(clave));
      alert("Progreso restablecido.");
    });

    // Permite iniciar sesión automáticamente cuando se llega desde el
    // servidor de prueba (secreto.html), sin exponer la contraseña en la URL.
    window.addEventListener("message", (event) => {
      if (!/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(event.origin) && event.origin !== "https://marconevi-lab.github.io") return;
      const data = event.data;
      if (!data || data.tipo !== "edu-login") return;

      const usuarios = cargarUsuarios();
      const encontrado = usuarios.find((u) => u.usuario === data.usuario && u.clave === data.clave);
      if (encontrado) {
        localStorage.setItem(CLAVE_SESION, JSON.stringify({ usuario: encontrado.usuario, rol: encontrado.rol }));
        pintarSesion();
      }
      if (event.source) {
        event.source.postMessage({ tipo: "edu-login-resultado", ok: !!encontrado }, event.origin);
      }
    });

    // Permite crear una cuenta nueva desde el servidor de prueba (secreto.html)
    // e iniciar sesión con ella automáticamente.
    window.addEventListener("message", (event) => {
      if (!/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(event.origin) && event.origin !== "https://marconevi-lab.github.io") return;
      const data = event.data;
      if (!data || data.tipo !== "edu-registro") return;

      const usuarios = cargarUsuarios();
      const yaExiste = usuarios.some((u) => u.usuario === data.usuario);
      if (!yaExiste) {
        usuarios.push({ usuario: data.usuario, clave: data.clave, rol: "profesor" });
        guardarUsuarios(usuarios);
        localStorage.setItem(CLAVE_SESION, JSON.stringify({ usuario: data.usuario, rol: "profesor" }));
        pintarSesion();
      }
      if (event.source) {
        event.source.postMessage({
          tipo: "edu-registro-resultado",
          ok: !yaExiste,
          mensaje: yaExiste ? "Ese usuario ya existe. Inicia sesión en su lugar." : ""
        }, event.origin);
      }
    });
  </script>
</body>
