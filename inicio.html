<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#51386a">
  <title>Elige asignatura y curso</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #292431;
      background: #f7f3fb;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 8% 6%, #e9dcff 0, transparent 24rem),
        linear-gradient(180deg, #fbf9ff, #f5f1f9);
    }

    .tarjeta {
      width: min(480px, calc(100% - 32px));
      margin: 32px 0;
      padding: 32px;
      border: 1px solid #e2d9eb;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 8px 24px #39264e12;
    }

    .etiqueta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border: 1px solid #d7c8e7;
      border-radius: 999px;
      background: #fff;
      color: #604777;
      font-size: .85rem;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    h1 { margin: 16px 0 8px; color: #39264e; font-size: clamp(1.6rem, 5vw, 2.2rem); line-height: 1.15; }
    p.intro { margin: 0 0 24px; color: #625b6c; font-size: 1.02rem; line-height: 1.5; }

    .selector { display: grid; gap: 5px; margin-bottom: 18px; }
    label { color: #51495d; font-size: .9rem; font-weight: 750; }

    select { font: inherit; }

    select {
      min-height: 46px;
      padding: 9px 38px 9px 12px;
      border: 1px solid #cfc4da;
      border-radius: 11px;
      background: white;
      color: #302a38;
    }

    select:focus-visible { outline: 3px solid #aa8ac8; outline-offset: 2px; }

    .boton-comenzar {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-top: 6px;
      padding: 10px 16px;
      border: 0;
      border-radius: 11px;
      background: #604777;
      color: white;
      font-weight: 800;
      text-decoration: none;
      cursor: pointer;
      transition: transform .14s ease, background .14s ease;
    }

    .boton-comenzar:hover { transform: translateY(-1px); background: #4c3562; }
    .boton-comenzar:focus-visible { outline: 3px solid #aa8ac8; outline-offset: 2px; }

    .sesion { margin-top: 20px; padding-top: 18px; border-top: 1px dashed #e2d9eb; }
    .sesion summary { color: #604777; font-weight: 750; font-size: .92rem; cursor: pointer; }
    .campo-sesion { display: grid; gap: 5px; margin-top: 12px; }
    .campo-sesion input {
      min-height: 42px;
      padding: 8px 12px;
      border: 1px solid #cfc4da;
      border-radius: 10px;
      font: inherit;
    }
    .campo-clave { position: relative; }
    .campo-clave input { padding-right: 40px; width: 100%; }
    .boton-ver-clave {
      position: absolute;
      top: 50%;
      right: 4px;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      min-height: auto;
      padding: 0;
      border: 0;
      background: none;
      font-size: 1.1rem;
      line-height: 1;
      color: #8a8195;
      cursor: pointer;
    }
    .boton-ver-clave:hover { color: #604777; }
    .boton-sesion {
      min-height: 42px;
      margin-top: 10px;
      padding: 8px 14px;
      border: 0;
      border-radius: 10px;
      background: #604777;
      color: white;
      font-weight: 750;
      font: inherit;
      cursor: pointer;
    }
    .boton-sesion:hover { background: #4c3562; }
    .boton-sesion.secundario { background: #eee8f4; color: #40334e; }
    .boton-sesion.secundario:hover { background: #e2d8ec; }
    .error-sesion { min-height: 1.2em; margin: 8px 0 0; color: #a32939; font-size: .85rem; font-weight: 700; }
    .estado-sesion { color: #46315c; font-weight: 750; font-size: .92rem; }

    .logo-usuarios {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: 1px solid #d7c8e7;
      border-radius: 50%;
      background: #fff;
      font-size: 1.4rem;
      text-decoration: none;
      box-shadow: 0 8px 24px #39264e12;
      transition: transform .14s ease, background .14s ease;
    }

    .logo-usuarios:hover { transform: translateY(-2px); background: #f1eafa; }
    .logo-usuarios:focus-visible { outline: 3px solid #aa8ac8; outline-offset: 2px; }
  </style>
</head>
<body>
  <a href="usuarios.html" class="logo-usuarios" title="Gestionar usuarios" aria-label="Gestionar usuarios">👤</a>
  <div class="tarjeta">
    <span class="etiqueta">🏠 Página de inicio</span>
    <h1>¿Qué quieres practicar hoy?</h1>
    <p class="intro">Elige la asignatura y el curso.</p>

    <div class="selector">
      <label for="asignatura">Asignatura</label>
      <select id="asignatura">
        <option value="matematicas">Matemáticas</option>
        <option value="ingles">Inglés</option>
        <option value="conocimiento-del-medio">Conocimiento del medio</option>
      </select>
    </div>

    <div class="selector">
      <label for="curso">Curso</label>
      <select id="curso">
        <option value="4-primaria">4.º de Primaria</option>
      </select>
    </div>

    <a id="comenzar" class="boton-comenzar" href="index.html">▶️ Comenzar</a>

    <details class="sesion" id="panel-sesion">
      <summary>🔑 Acceso docente (opcional)</summary>
      <div id="vista-invitado">
        <div class="campo-sesion">
          <label for="usuario-login">Usuario</label>
          <input id="usuario-login" type="text" autocomplete="username">
        </div>
        <div class="campo-sesion">
          <label for="clave-login">Contraseña</label>
          <div class="campo-clave">
            <input id="clave-login" type="password" autocomplete="current-password">
            <button type="button" class="boton-ver-clave" data-clave="clave-login" title="Mostrar contraseña" aria-label="Mostrar contraseña">👁️</button>
          </div>
        </div>
        <p id="error-login" class="error-sesion"></p>
        <button id="boton-login" type="button" class="boton-sesion">Iniciar sesión</button>
      </div>

      <div id="vista-sesion" hidden>
        <p class="estado-sesion">Sesión iniciada como <span id="nombre-sesion"></span></p>
        <button id="boton-logout" type="button" class="boton-sesion secundario">Cerrar sesión</button>
      </div>
    </details>
  </div>

  <script>
    const destinos = {
      "matematicas|4-primaria": "index.html",
      "ingles|4-primaria": "https://marconevi-lab.github.io/Educacion-de-ingles/",
      "conocimiento-del-medio|4-primaria": "https://marconevi-lab.github.io/Educacion-de-conocimiento-del-medio/"
    };

    const asignatura = document.querySelector("#asignatura");
    const curso = document.querySelector("#curso");
    const comenzar = document.querySelector("#comenzar");

    function actualizarDestino() {
      const destino = destinos[`${asignatura.value}|${curso.value}`];
      comenzar.href = destino || "#";
    }

    asignatura.addEventListener("change", actualizarDestino);
    curso.addEventListener("change", actualizarDestino);
    actualizarDestino();

    // Gestión de usuarios (guardada en este navegador, sin servidor)
    const CLAVE_USUARIOS = "edu-usuarios";
    const CLAVE_SESION = "edu-sesion";

    function cargarUsuarios() {
      try {
        const guardado = JSON.parse(localStorage.getItem(CLAVE_USUARIOS));
        if (Array.isArray(guardado) && guardado.length) return guardado;
      } catch {
        // Si no hay usuarios guardados o están corruptos, se recrea el admin inicial.
      }
      const iniciales = [{ usuario: "admin", clave: "Imanes.26-27", rol: "admin" }];
      localStorage.setItem(CLAVE_USUARIOS, JSON.stringify(iniciales));
      return iniciales;
    }

    function obtenerSesion() {
      try {
        return JSON.parse(localStorage.getItem(CLAVE_SESION));
      } catch {
        return null;
      }
    }

    const vistaInvitado = document.querySelector("#vista-invitado");
    const vistaSesion = document.querySelector("#vista-sesion");
    const nombreSesion = document.querySelector("#nombre-sesion");
    const errorLogin = document.querySelector("#error-login");

    function pintarSesion() {
      const sesion = obtenerSesion();
      vistaInvitado.hidden = !!sesion;
      vistaSesion.hidden = !sesion;
      if (sesion) nombreSesion.textContent = sesion.usuario;
    }

    document.querySelector("#boton-login").addEventListener("click", () => {
      const usuario = document.querySelector("#usuario-login").value.trim();
      const clave = document.querySelector("#clave-login").value;
      const usuarios = cargarUsuarios();
      const encontrado = usuarios.find((u) => u.usuario === usuario && u.clave === clave);
      if (!encontrado) {
        errorLogin.textContent = "Usuario o contraseña incorrectos.";
        return;
      }
      errorLogin.textContent = "";
      localStorage.setItem(CLAVE_SESION, JSON.stringify({ usuario: encontrado.usuario, rol: encontrado.rol }));
      pintarSesion();
    });

    document.querySelector("#boton-logout").addEventListener("click", () => {
      localStorage.removeItem(CLAVE_SESION);
      pintarSesion();
    });

    document.querySelectorAll(".boton-ver-clave").forEach((boton) => {
      boton.addEventListener("click", () => {
        const campo = document.querySelector(`#${boton.dataset.clave}`);
        const verClave = campo.type === "password";
        campo.type = verClave ? "text" : "password";
        boton.textContent = verClave ? "🙈" : "👁️";
        boton.title = verClave ? "Ocultar contraseña" : "Mostrar contraseña";
        boton.setAttribute("aria-label", boton.title);
      });
    });

    cargarUsuarios();
    pintarSesion();
  </script>
</body>
</html>
